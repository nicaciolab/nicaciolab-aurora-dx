# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: nicaciolab-aurora-dx
description: Imagem personalizada baseada no Aurora-DX com aplicativos e ferramentas de uso diário.

base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - micro
        - jq

  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - com.brave.Browser
        - org.onlyoffice.desktopeditors
        - ai.opencode.opencode
        - org.qbittorrent.qBittorrent
        - org.videolan.VLC

  - type: script
    snippets:
      - |
        set -euo pipefail
        HOST="api.github.com"
        REPO="AprilNEA/OpenLogi"
        API_URL="https://${HOST}/repos/${REPO}/releases/latest"
        RPM_URL=$(curl -fsSL "$API_URL" | jq -r '.assets[].browser_download_url | select(endswith(".rpm"))' | head -n 1)
        curl -fsSL "$RPM_URL" -o /tmp/openlogi.rpm
        dnf install -y /tmp/openlogi.rpm
        rm -f /tmp/openlogi.rpm

  - type: signing
