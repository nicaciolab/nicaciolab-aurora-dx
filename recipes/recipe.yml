---
# yaml-language-server: $schema=https://blue-build.org
name: nicaciolab-aurora-dx
description: Minha imagem personalizada do Aurora DX

base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - micro

  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - com.brave.Browser
        - org.onlyoffice.desktopeditors
  - type: signing
