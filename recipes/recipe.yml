---
# yaml-language-server: $schema=https://blue-build.org
name: nicaciolab-aurora-dx
description: Minha imagem personalizada do Aurora DX

base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - micro

  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - com.brave.Browser
        - org.onlyoffice.desktopeditors
        - ai.opencode.opencode
        - org.qbittorrent.qBittorrent
        - org.videolan.VLC

  # Instala o OpenCode CLI e a última release oficial (.rpm) do OpenLogi via API do GitHub
  - type: script
    snippets:
      - "curl -fsSL https://opencode.ai | OPENCODE_INSTALL_DIR=/usr/bin bash"
      - |
        RPM_URL=$(curl -fsSL https://github.com | grep -oE 'https://[^"]+\.rpm' | grep -E 'x86_64|amd64' | head -n 1)
        curl -fsSL "$RPM_URL" -o /tmp/openlogi.rpm
        dnf install -y /tmp/openlogi.rpm
        rm -f /tmp/openlogi.rpm

  - type: signing
